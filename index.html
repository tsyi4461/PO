<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>網址快速開啟器 iPhone版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:22px 16px 60px}
h1{font-size:27px;margin:8px 0}.hint{color:#9ba5b5;line-height:1.5;margin:5px 0 18px}
.box{background:#161a23;border:1px solid #2a3040;border-radius:18px;padding:15px;margin:12px 0}
textarea{display:block;width:100%;height:180px;border-radius:13px;border:1px solid #394052;background:#0d1017;color:#fff;padding:13px;font-size:16px;-webkit-appearance:none}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:17px;font-weight:700;touch-action:manipulation}
.add{background:#7283ff;color:#fff}.next{background:#35d095;color:#062117;font-size:20px;padding:18px}
.smallrow{display:flex;gap:8px}.smallrow button{background:#292f3c;color:#fff}
.status{font-size:15px;color:#b8c0cf;margin-bottom:10px}.current{padding:12px;background:#0d1017;border-radius:11px;word-break:break-all;color:#e5e9f2;min-height:46px}
.item{padding:11px 4px;border-bottom:1px solid #292f3c;display:flex;gap:10px}.item.done{opacity:.4}.n{color:#8490a4;min-width:25px}.u{word-break:break-all}
.error{color:#ff9eaa;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<main>
<h1>網址快速開啟器</h1>
<p class="hint">把網址貼到下面，可以一行一個，也可以整串貼上。</p>

<div class="box">
<textarea id="txt" placeholder="例如：
https://google.com
https://youtube.com
https://apple.com"></textarea>
<button id="addBtn" class="add" type="button">加入清單</button>
<div id="err" class="error"></div>
</div>

<div class="box">
<div id="status" class="status">目前 0 / 0</div>
<div id="current" class="current">尚未加入網址</div>
<button id="nextBtn" class="next" type="button">開啟下一個 →</button>
<div class="smallrow">
<button id="prevBtn" type="button">← 上一個</button>
<button id="resetBtn" type="button">重設</button>
<button id="clearBtn" type="button">清空</button>
</div>
</div>
<div id="list"></div>
</main>

<script>
(function(){
  var urls=[], pos=0;
  var txt=document.getElementById('txt');
  var err=document.getElementById('err');

  function extractUrls(text){
    text = text.replace(/\u3000/g,' ').trim();
    if(!text) return [];
    var found = text.match(/https?:\/\/[^\s<>"']+/gi);
    if(found && found.length) return found.map(function(x){return x.replace(/[，。；、]+$/,'');});
    return text.split(/[\n\r\s,，;；]+/).map(function(x){
      x=x.trim();
      if(!x) return '';
      if(x.indexOf('.')>-1 && !/^https?:\/\//i.test(x)) return 'https://'+x;
      return x;
    }).filter(function(x){return /^https?:\/\//i.test(x);});
  }

  function render(){
    document.getElementById('status').textContent='目前 '+Math.min(pos,urls.length)+' / '+urls.length+'　剩餘 '+Math.max(urls.length-pos,0);
    document.getElementById('current').textContent=
      urls.length===0?'尚未加入網址':(pos>=urls.length?'✓ 全部完成':'下一個：'+urls[pos]);
    var out='';
    for(var i=0;i<urls.length;i++){
      var safe=urls[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      out+='<div class="item '+(i<pos?'done':'')+'"><span class="n">'+(i+1)+'</span><span class="u">'+safe+'</span></div>';
    }
    document.getElementById('list').innerHTML=out;
  }

  document.getElementById('addBtn').onclick=function(){
    err.textContent='';
    var arr=extractUrls(txt.value);
    if(!arr.length){err.textContent='沒有讀到網址，請確認內容中有網址。';return;}
    urls=[];
    for(var i=0;i<arr.length;i++){
      if(urls.indexOf(arr[i])===-1) urls.push(arr[i]);
    }
    pos=0;
    render();
  };

  document.getElementById('nextBtn').onclick=function(){
    if(!urls.length){err.textContent='請先貼上網址並按「加入清單」。';return;}
    if(pos>=urls.length){alert('全部開完了');return;}
    var target=urls[pos];
    pos++;
    render();
    // iOS Safari: direct click handler is the most reliable place to open a new tab.
    var w=window.open(target,'_blank');
    if(!w){
      if(confirm('Safari 阻擋了新分頁。要改成目前頁面開啟嗎？')) window.location.href=target;
    }
  };

  document.getElementById('prevBtn').onclick=function(){if(pos>0){pos--;render();}};
  document.getElementById('resetBtn').onclick=function(){pos=0;render();};
  document.getElementById('clearBtn').onclick=function(){urls=[];pos=0;txt.value='';err.textContent='';render();};
  render();
})();
</script>
</body>
</html>
