<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>網址連續開啟器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:18px 14px 50px}
h1{font-size:26px;margin:8px 0}.hint{color:#9ca6b7;line-height:1.5;margin-bottom:14px}
.card{background:#161a23;border:1px solid #2b3140;border-radius:18px;padding:14px;margin:12px 0}
textarea{width:100%;height:160px;border:1px solid #394153;border-radius:13px;background:#0e1118;color:#fff;padding:13px;font-size:16px}
button{border:0;border-radius:15px;font-weight:800;touch-action:manipulation}
.add{width:100%;margin-top:10px;padding:14px;background:#7586ff;color:#fff;font-size:17px}
.status{color:#aeb8c8;font-size:15px;margin-bottom:10px}
.nextbox{width:100%;min-height:230px;background:#35d096;color:#062117;padding:24px 16px;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.nextbox .small{font-size:14px;font-weight:600;opacity:.75;word-break:break-all;max-width:100%}.nextbox:disabled{opacity:.48;cursor:not-allowed}
.controls{display:flex;gap:8px}.controls button{flex:1;padding:13px;background:#29303d;color:#fff;font-size:15px}
.current{word-break:break-all;color:#cdd4df;font-size:13px;margin-top:10px;line-height:1.4}
.done{background:#1b2e28;color:#75e8bd}
</style>
</head>
<body>
<main>
<h1>網址連續開啟器</h1>
<p class="hint">加入網址後，只要按一次開始。之後每次從 LINE 返回 Safari，會自動開啟下一個網址。</p>

<div class="card">
<textarea id="txt" placeholder="一行一個網址&#10;https://example.com/1&#10;https://example.com/2"></textarea>
<button id="add" class="add">加入清單</button>
</div>

<div class="card">
<div id="status" class="status">0 / 0</div>
<button id="next" class="nextbox">
  <span id="mainText">請先加入網址</span>
  <span id="smallText" class="small"></span>
</button>
<div class="controls">
<button id="prev">← 上一個</button>
<button id="reset">重設</button>
<button id="clear">清空</button>
</div>
<div id="current" class="current"></div>
</div>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
let urls=[], index=0, locked=false, hasLaunched=false, away=false, returnTimer=null;

function extract(t){
 let found=t.match(/https?:\/\/[^\s<>"']+/gi);
 if(found) return [...new Set(found.map(x=>x.replace(/[，。；、]+$/,'')))];
 return [...new Set(t.split(/[\s,，;；]+/).map(x=>{
   x=x.trim();
   if(!x)return "";
   return /^https?:\/\//i.test(x)?x:(x.includes(".")?"https://"+x:"");
 }).filter(Boolean))];
}
function save(){
 sessionStorage.setItem("urlQueue",JSON.stringify(urls));
 sessionStorage.setItem("urlIndex",String(index));
}
function render(){
 let remain=Math.max(urls.length-index,0);
 $("status").textContent="已開啟 "+Math.min(index,urls.length)+" / "+urls.length+"　剩餘 "+remain;
 $("next").classList.remove("done");
 if(!urls.length){
   $("mainText").textContent="請先加入網址";
   $("smallText").textContent="";
   $("current").textContent="";
 }else if(index>=urls.length){
   $("mainText").textContent="✓ 全部完成";
   $("smallText").textContent="按「重設」可以重新開始";
   $("current").textContent="";
   $("next").classList.add("done");
 }else{
   $("mainText").textContent=index===0?"開始開啟":"點一下，開下一個";
   $("smallText").textContent="第 "+(index+1)+" 個";
   $("current").textContent="下一個："+urls[index];
 }
}
function go(){
 if(locked)return;
 if(!urls.length){alert("請先加入網址");return}
 if(index>=urls.length)return;
 locked=true;
 $("next").disabled=true;
 $("mainText").textContent="開啟中…";
 const target=urls[index];
 index++;
 hasLaunched=true;
 save();
 // Navigation happens synchronously inside the user's tap event.
 window.location.assign(target);
}
$("add").onclick=function(){
 urls=extract($("txt").value);
 index=0;
 locked=false;
 $("next").disabled=false;
 save();
 render();
};
$("next").onclick=go;
$("prev").onclick=function(){if(index>0){index--;locked=false;$("next").disabled=false;save();render()}};
$("reset").onclick=function(){index=0;locked=false;$("next").disabled=false;save();render()};
$("clear").onclick=function(){urls=[];index=0;locked=false;$("next").disabled=false;$("txt").value="";save();render()};

try{
 let saved=JSON.parse(sessionStorage.getItem("urlQueue")||"[]");
 if(saved.length){
   urls=saved;
   index=parseInt(sessionStorage.getItem("urlIndex")||"0",10);
   $("txt").value=urls.join("\n");
 }
}catch(e){}

function unlockAfterReturn(){
 locked=false;
 $("next").disabled=false;
 render();
}
function autoNextAfterReturn(){
 if(!hasLaunched || !away || index>=urls.length){unlockAfterReturn();return;}
 away=false;
 clearTimeout(returnTimer);
 $("mainText").textContent="已返回，準備下一個…";
 returnTimer=setTimeout(function(){
   unlockAfterReturn();
   go();
 },100);
}
document.addEventListener("visibilitychange",function(){
 if(document.visibilityState==="hidden" && hasLaunched) away=true;
 else if(document.visibilityState==="visible") autoNextAfterReturn();
});
window.addEventListener("pagehide",function(){if(hasLaunched) away=true;});
window.addEventListener("pageshow",function(){if(hasLaunched) autoNextAfterReturn(); else unlockAfterReturn();});

render();
})();
</script>
</body>
</html>
