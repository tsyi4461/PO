<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>網址連續開啟器</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:20px 16px 55px} h1{font-size:27px;margin:8px 0}.hint{color:#9ca6b7;line-height:1.55}
.card{background:#161a23;border:1px solid #2b3140;border-radius:18px;padding:15px;margin:13px 0}
textarea{width:100%;height:175px;border:1px solid #3a4254;border-radius:13px;background:#0e1118;color:white;padding:13px;font-size:16px}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:17px;font-weight:700}
.add{background:#7485ff;color:#fff}.start{background:#36d096;color:#061c14;font-size:21px;padding:18px}
.stop{background:#3b2630;color:#ffb7c2}.status{color:#b7c0cf;margin-bottom:10px}.current{background:#0e1118;padding:12px;border-radius:11px;word-break:break-all;min-height:47px}
.mode{display:flex;align-items:center;gap:9px;color:#c5ccda;margin-top:12px}.mode input{width:20px;height:20px}
.notice{margin-top:11px;color:#91a0b5;font-size:13px;line-height:1.5}.done{font-size:26px;text-align:center;padding:22px}
</style>
</head>
<body>
<main>
<h1>網址連續開啟器</h1>
<p class="hint">第一次按「開始」。進入目標網站後，用 iPhone 左上角返回；回到這頁時會自動嘗試前往下一個。</p>

<div class="card">
<textarea id="txt" placeholder="一行一個網址&#10;https://example.com/1&#10;https://example.com/2"></textarea>
<button class="add" id="add">加入清單</button>
<label class="mode"><input id="auto" type="checkbox" checked> 返回後自動開啟下一個</label>
</div>

<div class="card">
<div class="status" id="status">0 / 0</div>
<div class="current" id="current">尚未加入網址</div>
<button class="start" id="start">開始 / 開啟下一個 →</button>
<button class="stop" id="stop">停止連續模式</button>
<div class="notice">注意：iOS Safari 可能依版本或網站行為限制自動導向。如果沒有自動跳轉，直接按綠色按鈕即可繼續。</div>
</div>
<div id="finished"></div>
</main>

<script>
(function(){
 const $=id=>document.getElementById(id);
 let urls=[], index=0, running=false, leaving=false, lastLeave=0;

 function extract(t){
   let m=t.match(/https?:\/\/[^\s<>"']+/gi);
   if(m) return [...new Set(m.map(x=>x.replace(/[，。；、]+$/,'')))];
   return [...new Set(t.split(/[\s,，;；]+/).map(x=>{
     x=x.trim(); if(!x)return "";
     return /^https?:\/\//i.test(x)?x:(x.includes(".")?"https://"+x:"");
   }).filter(Boolean))];
 }
 function render(){
   $("status").textContent=`已處理 ${Math.min(index,urls.length)} / ${urls.length}　剩餘 ${Math.max(urls.length-index,0)}`;
   $("current").textContent=!urls.length?"尚未加入網址":index>=urls.length?"✓ 全部完成":"下一個："+urls[index];
   $("finished").innerHTML=(urls.length && index>=urls.length)?'<div class="done">🎉 全部完成</div>':'';
 }
 function goNext(){
   if(!urls.length){alert("請先加入網址");return}
   if(index>=urls.length){running=false;render();return}
   running=true;
   const target=urls[index];
   index++;
   leaving=true;
   lastLeave=Date.now();
   sessionStorage.setItem("qo_index",String(index));
   sessionStorage.setItem("qo_running","1");
   sessionStorage.setItem("qo_urls",JSON.stringify(urls));
   render();
   // Same-tab navigation gives iPhone's Back button a clean path back here.
   window.location.href=target;
 }
 $("add").onclick=function(){
   urls=extract($("txt").value); index=0; running=false;
   sessionStorage.setItem("qo_urls",JSON.stringify(urls));
   sessionStorage.setItem("qo_index","0");
   sessionStorage.setItem("qo_running","0");
   render();
 };
 $("start").onclick=goNext;
 $("stop").onclick=function(){
   running=false; sessionStorage.setItem("qo_running","0"); render();
 };

 // Restore state after navigating back.
 try{
   const saved=JSON.parse(sessionStorage.getItem("qo_urls")||"[]");
   if(saved.length){
     urls=saved;
     index=parseInt(sessionStorage.getItem("qo_index")||"0",10);
     running=sessionStorage.getItem("qo_running")==="1";
     $("txt").value=urls.join("\n");
   }
 }catch(e){}

 function returned(){
   // Ignore events fired during initial page load or immediately while leaving.
   if(leaving && Date.now()-lastLeave<1200) return;
   leaving=false;
   if(running && $("auto").checked && urls.length && index<urls.length){
     // Short delay lets Safari fully restore the page before navigating again.
     setTimeout(function(){
       if(document.visibilityState==="visible" && running) goNext();
     },450);
   }
 }

 window.addEventListener("pageshow",function(e){
   // persisted=true is common when Safari restores this page from back-forward cache.
   if(e.persisted) returned();
 });
 document.addEventListener("visibilitychange",function(){
   if(document.visibilityState==="visible") returned();
 });

 render();
})();
</script>
</body>
</html>
